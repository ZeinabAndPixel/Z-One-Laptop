
<!DOCTYPE html>
<html lang="es" class="scroll-smooth dark">
<head>
  <meta charset="utf-8">
  <title>Portfolio - Zeinab Muslumani</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Library (Global Load) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- jsPDF Library for CV Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts: Playfair Display for headers (Elegant) and Outfit for body (Modern) -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%237c3aed'/%3E%3Ctext x='50' y='70' font-family='serif' font-weight='bold' font-size='70' text-anchor='middle' fill='white'%3EZ%3C/text%3E%3C/svg%3E">

  <style>
    /* CSS Variables for Theming */
    :root {
      /* Light Mode */
      --gothic-bg: 248 250 252;       /* Slate 50 */
      --gothic-accent: 124 58 237;    /* Violet 600 */
      --gothic-secondary: 255 255 255;/* White */
      --gothic-text: 15 23 42;        /* Slate 900 */
      --gothic-card-bg: 255 255 255;
    }

    .dark {
      /* Dark Mode - Deep Space Premium Vibe */
      --gothic-bg: 3 0 20;            /* Almost black violet */
      --gothic-accent: 168 85 247;    /* Vibrant Purple */
      --gothic-secondary: 30 20 60;   /* Deep Purple */
      --gothic-text: 240 240 255;     /* White-ish */
      --gothic-card-bg: 255 255 255;  /* Used with opacity in dark mode */
    }

    /* Animated Background Gradient */
    body {
      background-color: rgb(var(--gothic-bg));
      background-image: 
        radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      background-size: 100% 100%;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgb(var(--gothic-bg));
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, rgb(var(--gothic-accent)), #ec4899);
      border-radius: 4px;
    }
    
    /* Animation Utilities */
    .fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
      opacity: 0;
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Blob Animation */
    @keyframes morph {
      0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
      50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
      100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
    }

    .animate-morph {
      animation: morph 8s ease-in-out infinite;
    }

    /* Gradient Text Utility */
    .text-gradient {
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-image: linear-gradient(to right, rgb(var(--gothic-accent)), #ec4899, #38bdf8);
    }
    
    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 200ms; }
    .delay-300 { animation-delay: 300ms; }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gothic: {
              bg: 'rgb(var(--gothic-bg) / <alpha-value>)',
              accent: 'rgb(var(--gothic-accent) / <alpha-value>)',
              secondary: 'rgb(var(--gothic-secondary) / <alpha-value>)',
              text: 'rgb(var(--gothic-text) / <alpha-value>)'
            }
          },
          fontFamily: {
            display: ['"Playfair Display"', 'serif'],
            body: ['"Outfit"', 'sans-serif'],
          },
          animation: {
            'spin-slow': 'spin 10s linear infinite',
            'float': 'float 6s ease-in-out infinite',
            'morph': 'morph 8s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20px)' },
            }
          }
        }
      }
    }
  </script>

    "@angular/platform-browser": "https://esm.sh/@angular/platform-browser@^21.1.2?external=rxjs",
    "@angular/core": "https://esm.sh/@angular/core@^21.1.2?external=rxjs",
    "@angular/common": "https://esm.sh/@angular/common@^21.1.2?external=rxjs",
    "@angular/compiler": "https://esm.sh/@angular/compiler@^21.1.2?external=rxjs",
    "@angular/forms": "https://esm.sh/@angular/forms@^21.1.2?external=rxjs"
  }
}
</script>
